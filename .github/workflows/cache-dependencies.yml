name: Caching composer packages

on:
  push:
    branches:
      - 'dev'

env:
  # Keep in step with GAIA_ENV_TAG in ci.yml, so the warmed cache is the one CI reads.
  GAIA_ENV_TAG: 8.5.12-phalcon5.23.0

jobs:
  Install-and-cache-composer-packages:

    runs-on: ubuntu-latest
    container:
      image: ghcr.io/projects4me/gaia-env:${{ env.GAIA_ENV_TAG }}
    steps:
    - name: Checkout to Repository
      uses: actions/checkout@v5

    - name: Cache Composer packages
      id: composer-packages
      uses: actions/cache@v5
      with:
        path: vendor
        key: vendor-cache-gaia-env-${{ env.GAIA_ENV_TAG }}-${{ hashFiles('composer.json') }}
        restore-keys: vendor-cache-gaia-env-${{ env.GAIA_ENV_TAG }}-

    - name: Install Dependencies
      if: steps.composer-packages.outputs.cache-hit != 'true'
      run: |
        composer install