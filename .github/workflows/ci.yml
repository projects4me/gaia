name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]

env:
  # The gaia-env image tag every job pulls (built in projects4me/docker-images).
  GAIA_ENV_TAG: 8.5.12-phalcon5.23.0

jobs:

  graph-drift:
    name: Graph and docs drift (gaia-dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        # Runs each step's script in the gaia-ci container (RUNNER_TEMP is mounted at the same path).
        shell: >-
          docker exec -e GITHUB_WORKSPACE
          gaia-ci bash --noprofile --norc -eo pipefail {0}

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Pull gaia-env
      shell: bash
      run: |
        docker pull ghcr.io/projects4me/gaia-env:${{ env.GAIA_ENV_TAG }}
        docker tag ghcr.io/projects4me/gaia-env:${{ env.GAIA_ENV_TAG }} gaia-env:ci

    # Host network: the container reaches the postgres service on 127.0.0.1:5432, and the
    # api-tester reaches Apache on 127.0.0.1.
    - name: Start the gaia-ci container
      shell: bash
      run: |
        mkdir -p logs output
        docker run -d --name gaia-ci --network host           -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP"           -w "$GITHUB_WORKSPACE"           gaia-env:ci sleep infinity
        docker exec gaia-ci php -v

    - name: Cache Composer packages
      id: composer-packages
      uses: actions/cache@v5
      with:
        path: vendor
        key: vendor-cache-gaia-env-${{ env.GAIA_ENV_TAG }}-${{ hashFiles('composer.lock') }}
        restore-keys: vendor-cache-gaia-env-${{ env.GAIA_ENV_TAG }}-

    - name: Install dependencies
      if: steps.composer-packages.outputs.cache-hit != 'true'
      run: COMPOSER_ALLOW_SUPERUSER=1 composer install --no-interaction

    - name: Check docs/generated/graph.json is up to date
      run: php tools/gaia-dev/bin/gaia-dev graph export --check

    - name: Check docs/generated pages are up to date
      run: php tools/gaia-dev/bin/gaia-dev docs generate --check

    - name: Check the api-tester catalogs are consistent
      run: php tools/gaia-dev/bin/gaia-dev check api-cases

  deployed-image-config:
    name: Deployed image never displays PHP errors
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Pull gaia-env
      shell: bash
      run: |
        docker pull ghcr.io/projects4me/gaia-env:${{ env.GAIA_ENV_TAG }}
        docker tag ghcr.io/projects4me/gaia-env:${{ env.GAIA_ENV_TAG }} gaia-env:ci

    - name: Build the deployed image (docker/dev/Dockerfile)
      run: docker build -f docker/dev/Dockerfile --build-arg ENV_IMAGE=gaia-env:ci -t gaia-deployed:ci .

    - name: Check display_errors is off in the deployed image
      run: tools/ci/check-php-display-errors.sh gaia-deployed:ci

  api-testing:
    name: API + PHPUnit
    runs-on: ubuntu-latest
    env:
      DB_ADAPTER: Postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: nouman
      DB_PASSWORD: nouman
      DB_NAME: pr4m_test
    defaults:
      run:
        # Runs each step's script in the gaia-ci container (RUNNER_TEMP is mounted at the same path);
        # -e NAME forwards the variable from the step's environment when it is set.
        shell: >-
          docker exec
          -e DB_ADAPTER -e DB_HOST -e DB_PORT -e DB_USERNAME -e DB_PASSWORD -e DB_NAME
          -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PG_USER
          -e GITHUB_WORKSPACE -e GITHUB_STEP_SUMMARY
          gaia-ci bash --noprofile --norc -eo pipefail {0}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pr4m
          POSTGRES_USER: nouman
          POSTGRES_PASSWORD: nouman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nouman -d pr4m"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Pull gaia-env
      shell: bash
      run: |
        docker pull ghcr.io/projects4me/gaia-env:${{ env.GAIA_ENV_TAG }}
        docker tag ghcr.io/projects4me/gaia-env:${{ env.GAIA_ENV_TAG }} gaia-env:ci

    # Host network: the container reaches the postgres service on 127.0.0.1:5432, and the
    # api-tester reaches Apache on 127.0.0.1.
    - name: Start the gaia-ci container
      shell: bash
      run: |
        mkdir -p logs output
        docker run -d --name gaia-ci --network host           -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP"           -w "$GITHUB_WORKSPACE"           gaia-env:ci sleep infinity
        docker exec gaia-ci php -v

    - name: Cache Composer packages
      id: composer-packages
      uses: actions/cache@v5
      with:
        path: vendor
        key: vendor-cache-gaia-env-${{ env.GAIA_ENV_TAG }}-${{ hashFiles('composer.lock') }}
        restore-keys: vendor-cache-gaia-env-${{ env.GAIA_ENV_TAG }}-

    - name: Install dependencies
      if: steps.composer-packages.outputs.cache-hit != 'true'
      run: COMPOSER_ALLOW_SUPERUSER=1 composer install --no-interaction

    - name: Install PostgreSQL 16 client
      run: |
        apt-get update
        apt-get install -y --no-install-recommends curl ca-certificates gnupg
        install -d /usr/share/postgresql-common/pgdg
        curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc
        . /etc/os-release
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
          > /etc/apt/sources.list.d/pgdg.list
        apt-get update
        apt-get install -y --no-install-recommends postgresql-client-16
        ln -sf /usr/lib/postgresql/16/bin/psql /usr/local/bin/psql
        ln -sf /usr/lib/postgresql/16/bin/pg_dump /usr/local/bin/pg_dump

    - name: Load baseline into pr4m
      env:
        PGPASSWORD: nouman
      run: |
        psql -h 127.0.0.1 -U nouman -d pr4m -v ON_ERROR_STOP=1 \
          -f db/Dump20261118.sql

    - name: Migrate pr4m schema from metadata
      env:
        DB_NAME: pr4m
      run: php cli.php migration migrate

    - name: Prepare pr4m_test + fixtures
      env:
        PGHOST: 127.0.0.1
        PGPASSWORD: nouman
      run: bash tools/api-tester/harness/prepare-test-db.sh

    - name: Run PHPUnit (whole suite, quarantine excluded)
      run: |
        mkdir -p logs/tests
        ./vendor/bin/phpunit -c tests/phpunit.xml \
          --exclude-group quarantine \
          --log-junit logs/tests/phpunit-junit.xml

    - name: Upload PHPUnit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: phpunit-junit-report
        path: logs/tests/phpunit-junit.xml
        if-no-files-found: warn

    - name: Reset pr4m_test + fixtures for the API tests
      env:
        PGHOST: 127.0.0.1
        PGPASSWORD: nouman
      run: bash tools/api-tester/harness/prepare-test-db.sh

    - name: Start Apache
      run: |
        # Log every PHP deprecation and warning of the API requests (checked by the PHP diagnostics gate below).
        cp docker/php/conf.d/diagnostics.ini /usr/local/etc/php/conf.d/zz-diagnostics.ini
        rm -f logs/php-diagnostics.log
        install -m 666 /dev/null logs/php-diagnostics.log
        rm -rf /var/www/html
        ln -s "$GITHUB_WORKSPACE" /var/www/html
        chown -R www-data:www-data "$GITHUB_WORKSPACE"
        # setsid: Apache must outlive this docker exec session.
        # Throwaway key so the settings API can store secure values (SMTP password) in CI.
        export SETTINGS_ENCRYPTION_KEY="$(openssl rand -base64 32)"
        setsid apache2-foreground > /tmp/apache.log 2>&1 < /dev/null &
        for i in $(seq 1 30); do
          curl -s -o /dev/null "http://127.0.0.1/" && echo "Apache is up" && exit 0
          sleep 1
        done
        echo "Apache did not come up in time" >&2
        cat /tmp/apache.log >&2
        exit 1

    - name: Run backend API testing
      run: |
        tools/api-tester/harness/run-api-tests.sh \
          --base-uri http://127.0.0.1 \
          --mode backend,acl \
          --record-bodies

    # Report only: client mode has known failures in CI (SMTP, secure settings, timestamps),
    # so it must not gate this job.
    - name: Run client API testing (report only)
      continue-on-error: true
      run: |
        tools/api-tester/harness/run-api-tests.sh \
          --base-uri http://127.0.0.1 \
          --mode client \
          --record-bodies

    - name: Upload API testing report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: api-tester-backend-report
        path: output/api-tester-backend-report.json
        if-no-files-found: warn

    # Blocking: the count of PHP deprecations and warnings in Gaia code stays at 0. Vendor entries are reported only.
    # Reproduce locally: docs/dev/php-diagnostics-gate.md
    - name: PHP diagnostics gate (no deprecation or warning in Gaia code)
      if: success() || failure()
      run: |
        tools/quality/lint-php.sh logs/php-lint.log
        set +e
        php tools/quality/deprecations-report.php --fail-on-gaia           logs/php-diagnostics-phpunit.log logs/php-diagnostics.log logs/php-lint.log > logs/php-diagnostics-report.md
        status=$?
        cat logs/php-diagnostics-report.md >> "$GITHUB_STEP_SUMMARY"
        exit $status

    - name: Upload PHP diagnostics report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: php-diagnostics
        path: |
          logs/php-diagnostics-report.md
          logs/php-diagnostics.log
          logs/php-diagnostics-phpunit.log
          logs/php-lint.log
        if-no-files-found: warn
