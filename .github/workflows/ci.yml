name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:

  graph-drift:
    name: Graph and docs drift (gaia-dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        # Runs each step's script in the gaia-current container (RUNNER_TEMP is mounted at the same path).
        shell: >-
          docker exec -e GITHUB_WORKSPACE
          gaia-current bash --noprofile --norc -eo pipefail {0}

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Keep the build args equal to build_current in docker/env/build.sh.
    - name: Build gaia-env:current
      uses: docker/build-push-action@v6
      with:
        context: docker/env
        load: true
        tags: gaia-env:current
        cache-from: type=gha,scope=gaia-env-current
        cache-to: type=gha,scope=gaia-env-current,mode=max
        build-args: |
          BASE_IMAGE=php:7.4.21-apache-buster
          DEBIAN_ARCHIVE=1
          PHALCON_VERSION=4.1.2
          PSR_VERSION=1.1.0
          XDEBUG_VERSION=3.1.5
          XHPROF_VERSION=2.3.7
          MONGODB_VERSION=1.15.3
          PHPUNIT_VERSION=9.6.21

    # Host network: the container reaches the postgres service on 127.0.0.1:5432, and the
    # api-tester reaches Apache on 127.0.0.1.
    - name: Start the gaia-current container
      shell: bash
      run: |
        mkdir -p upgrade logs output
        docker run -d --name gaia-current --network host           -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP"           -w "$GITHUB_WORKSPACE"           gaia-env:current sleep infinity
        docker exec gaia-current php -v

    - name: Cache Composer packages
      id: composer-packages
      uses: actions/cache@v5
      with:
        path: vendor
        key: vendor-cache-gaia-env-current-${{ hashFiles('docker/env/**') }}-${{ hashFiles('composer.json') }}
        restore-keys: vendor-cache-gaia-env-current-${{ hashFiles('docker/env/**') }}-

    - name: Install dependencies
      if: steps.composer-packages.outputs.cache-hit != 'true'
      run: COMPOSER_ALLOW_SUPERUSER=1 composer install --no-interaction

    - name: Check docs/generated/graph.json is up to date
      run: php tools/gaia-dev/bin/gaia-dev graph export --check

    - name: Check docs/generated pages are up to date
      run: php tools/gaia-dev/bin/gaia-dev docs generate --check

    - name: Check the api-tester catalogs are consistent
      run: php tools/gaia-dev/bin/gaia-dev check api-cases

  api-testing:
    name: API + PHPUnit
    runs-on: ubuntu-latest
    env:
      DB_ADAPTER: Postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: nouman
      DB_PASSWORD: nouman
      DB_NAME: pr4m_test
    defaults:
      run:
        # Runs each step's script in the gaia-current container (RUNNER_TEMP is mounted at the same path);
        # -e NAME forwards the variable from the step's environment when it is set.
        shell: >-
          docker exec
          -e DB_ADAPTER -e DB_HOST -e DB_PORT -e DB_USERNAME -e DB_PASSWORD -e DB_NAME
          -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PG_USER
          -e GITHUB_WORKSPACE
          gaia-current bash --noprofile --norc -eo pipefail {0}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pr4m
          POSTGRES_USER: nouman
          POSTGRES_PASSWORD: nouman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nouman -d pr4m"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Keep the build args equal to build_current in docker/env/build.sh.
    - name: Build gaia-env:current
      uses: docker/build-push-action@v6
      with:
        context: docker/env
        load: true
        tags: gaia-env:current
        cache-from: type=gha,scope=gaia-env-current
        cache-to: type=gha,scope=gaia-env-current,mode=max
        build-args: |
          BASE_IMAGE=php:7.4.21-apache-buster
          DEBIAN_ARCHIVE=1
          PHALCON_VERSION=4.1.2
          PSR_VERSION=1.1.0
          XDEBUG_VERSION=3.1.5
          XHPROF_VERSION=2.3.7
          MONGODB_VERSION=1.15.3
          PHPUNIT_VERSION=9.6.21

    # Host network: the container reaches the postgres service on 127.0.0.1:5432, and the
    # api-tester reaches Apache on 127.0.0.1.
    - name: Start the gaia-current container
      shell: bash
      run: |
        mkdir -p upgrade logs output
        docker run -d --name gaia-current --network host           -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP"           -w "$GITHUB_WORKSPACE"           gaia-env:current sleep infinity
        docker exec gaia-current php -v

    - name: Cache Composer packages
      id: composer-packages
      uses: actions/cache@v5
      with:
        path: vendor
        key: vendor-cache-gaia-env-current-${{ hashFiles('docker/env/**') }}-${{ hashFiles('composer.json') }}
        restore-keys: vendor-cache-gaia-env-current-${{ hashFiles('docker/env/**') }}-

    - name: Install dependencies
      if: steps.composer-packages.outputs.cache-hit != 'true'
      run: COMPOSER_ALLOW_SUPERUSER=1 composer install --no-interaction

    - name: Install PostgreSQL 16 client
      run: |
        apt-get update
        apt-get install -y --no-install-recommends curl ca-certificates gnupg
        install -d /usr/share/postgresql-common/pgdg
        curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc
        echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt-archive.postgresql.org/pub/repos/apt buster-pgdg main' \
          > /etc/apt/sources.list.d/pgdg.list
        apt-get update
        apt-get install -y --no-install-recommends postgresql-client-16
        ln -sf /usr/lib/postgresql/16/bin/psql /usr/local/bin/psql
        ln -sf /usr/lib/postgresql/16/bin/pg_dump /usr/local/bin/pg_dump

    - name: Load baseline into pr4m
      env:
        PGPASSWORD: nouman
      run: |
        psql -h 127.0.0.1 -U nouman -d pr4m -v ON_ERROR_STOP=1 \
          -f db/Dump20261118.sql

    - name: Migrate pr4m schema from metadata
      env:
        DB_NAME: pr4m
      run: php cli.php migration migrate

    - name: Schema snapshot of pr4m (for the next-stack comparison)
      # Feeds the non-blocking next-stack report only, so a failure here must not fail this job.
      continue-on-error: true
      env:
        PGHOST: 127.0.0.1
        PGUSER: nouman
        PGPASSWORD: nouman
      run: |
        mkdir -p upgrade
        bash tools/upgrade/schema-snapshot.sh pr4m upgrade/schema.sql

    - name: Prepare pr4m_test + fixtures
      env:
        PGHOST: 127.0.0.1
        PGPASSWORD: nouman
      run: bash tools/api-tester/harness/prepare-test-db.sh

    - name: Run PHPUnit (whole suite, quarantine excluded)
      run: |
        mkdir -p logs/tests
        ./vendor/bin/phpunit -c tests/phpunit.xml \
          --exclude-group quarantine \
          --log-junit logs/tests/phpunit-junit.xml

    - name: Upload PHPUnit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: phpunit-junit-report
        path: logs/tests/phpunit-junit.xml
        if-no-files-found: warn

    - name: Reset pr4m_test + fixtures for the API tests
      env:
        PGHOST: 127.0.0.1
        PGPASSWORD: nouman
      run: bash tools/api-tester/harness/prepare-test-db.sh

    - name: Start Apache
      run: |
        rm -rf /var/www/html
        ln -s "$GITHUB_WORKSPACE" /var/www/html
        chown -R www-data:www-data "$GITHUB_WORKSPACE"
        # setsid: Apache must outlive this docker exec session.
        setsid apache2-foreground > /tmp/apache.log 2>&1 < /dev/null &
        for i in $(seq 1 30); do
          curl -s -o /dev/null "http://127.0.0.1/" && echo "Apache is up" && exit 0
          sleep 1
        done
        echo "Apache did not come up in time" >&2
        cat /tmp/apache.log >&2
        exit 1

    - name: Run backend API testing
      run: |
        tools/api-tester/harness/run-api-tests.sh \
          --base-uri http://127.0.0.1 \
          --mode backend,acl \
          --record-bodies

    - name: Upload API testing report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: api-tester-backend-report
        path: output/api-tester-backend-report.json
        if-no-files-found: warn

    - name: Upload the current-stack outputs for the next-stack comparison
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upgrade-current
        path: |
          upgrade/schema.sql
          output/api-tester-backend-report.json
          output/api-tester-acl-report.json
        if-no-files-found: warn

  # Non-blocking: the same checks on PHP 8.5 / Phalcon 5.23, keeping every output for the
  # upgrade-report job. gaia-env:next is not published, so the job builds it from
  # docker/env/Dockerfile (layers cached in the GitHub Actions cache) and runs every check
  # inside it through the docker exec shell below. Each check step has continue-on-error: a
  # failure on the next stack is reported in the summary (and in the step outcomes) instead
  # of turning the job red. The job itself only fails when the image or container can't be
  # set up. Only api-testing is a required check.
  next-stack:
    name: Next stack (PHP 8.5 / Phalcon 5.23, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DB_ADAPTER: Postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: nouman
      DB_PASSWORD: nouman
      DB_NAME: pr4m_test
    defaults:
      run:
        # Runs each step's script in the gaia-next container. The script file lives in
        # RUNNER_TEMP, which is mounted at the same path; -e NAME forwards the variable from
        # the step's environment when it is set.
        shell: >-
          docker exec
          -e DB_ADAPTER -e DB_HOST -e DB_PORT -e DB_USERNAME -e DB_PASSWORD -e DB_NAME
          -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PG_USER
          -e GITHUB_WORKSPACE
          gaia-next bash --noprofile --norc -eo pipefail {0}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pr4m
          POSTGRES_USER: nouman
          POSTGRES_PASSWORD: nouman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nouman -d pr4m"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Keep the build args equal to build_next in docker/env/build.sh.
    - name: Build gaia-env:next
      uses: docker/build-push-action@v6
      with:
        context: docker/env
        load: true
        tags: gaia-env:next
        cache-from: type=gha,scope=gaia-env-next
        cache-to: type=gha,scope=gaia-env-next,mode=max
        build-args: |
          BASE_IMAGE=php:8.5.12-apache
          DEBIAN_ARCHIVE=0
          PHALCON_VERSION=5.23.0
          PSR_VERSION=
          XDEBUG_VERSION=3.5.3
          XHPROF_VERSION=2.3.10
          MONGODB_VERSION=
          PHPUNIT_VERSION=11.5.0

    # Host network: the container reaches the postgres service on 127.0.0.1:5432, and the
    # api-tester reaches Apache on 127.0.0.1. upgrade/ and logs/ are created on the host so
    # the host-side steps below can write into them.
    - name: Start the gaia-next container
      shell: bash
      run: |
        mkdir -p upgrade logs
        docker run -d --name gaia-next --network host \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
          -w "$GITHUB_WORKSPACE" \
          gaia-env:next sleep infinity
        docker exec gaia-next php -v

    - name: Cache Composer packages
      id: composer-packages
      uses: actions/cache@v5
      with:
        path: vendor
        key: vendor-cache-gaia-env-next-${{ hashFiles('docker/env/**') }}-${{ hashFiles('composer.json') }}
        restore-keys: vendor-cache-gaia-env-next-${{ hashFiles('docker/env/**') }}-

    - name: Install dependencies
      if: steps.composer-packages.outputs.cache-hit != 'true'
      run: COMPOSER_ALLOW_SUPERUSER=1 composer install --no-interaction

    - name: Install PostgreSQL 16 client
      run: |
        apt-get update
        apt-get install -y --no-install-recommends curl ca-certificates gnupg
        install -d /usr/share/postgresql-common/pgdg
        curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc
        . /etc/os-release
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
          > /etc/apt/sources.list.d/pgdg.list
        apt-get update
        apt-get install -y --no-install-recommends postgresql-client-16
        ln -sf /usr/lib/postgresql/16/bin/psql /usr/local/bin/psql
        ln -sf /usr/lib/postgresql/16/bin/pg_dump /usr/local/bin/pg_dump
        psql --version

    - name: Load baseline into pr4m
      env:
        PGPASSWORD: nouman
      run: |
        psql -h 127.0.0.1 -U nouman -d pr4m -v ON_ERROR_STOP=1 \
          -f db/Dump20261118.sql

    - name: Migration dry run on pr4m
      id: dry-run
      if: ${{ !cancelled() }}
      continue-on-error: true
      env:
        DB_NAME: pr4m
      run: |
        set +e
        php cli.php migration migrate --dry-run > upgrade/dry-run.txt 2>&1
        status=$?
        cat upgrade/dry-run.txt
        # 0: nothing planned, 2: changes planned, anything else: the dry run failed
        [ "$status" -eq 0 ] || [ "$status" -eq 2 ]

    - name: Migrate pr4m schema from metadata
      id: migrate
      if: ${{ !cancelled() }}
      continue-on-error: true
      env:
        DB_NAME: pr4m
      run: php cli.php migration migrate

    - name: Schema snapshot of pr4m
      id: schema
      if: ${{ !cancelled() }}
      continue-on-error: true
      env:
        PGHOST: 127.0.0.1
        PGUSER: nouman
        PGPASSWORD: nouman
      run: bash tools/upgrade/schema-snapshot.sh pr4m upgrade/schema.sql

    - name: Prepare pr4m_test + fixtures
      id: prepare
      if: ${{ !cancelled() }}
      continue-on-error: true
      env:
        PGHOST: 127.0.0.1
        PGPASSWORD: nouman
      run: bash tools/api-tester/harness/prepare-test-db.sh

    - name: Run PHPUnit (whole suite, quarantine excluded)
      id: phpunit
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |
        ./vendor/bin/phpunit -c tests/phpunit.xml \
          --exclude-group quarantine \
          --log-junit upgrade/phpunit-junit.xml

    # Before Apache: the diagnostics ini loaded for Apache also applies to the CLI.
    - name: Lint every PHP file on the next stack
      id: lint
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: IMAGE=none bash tools/upgrade/lint-next.sh upgrade/php-lint-next.log

    - name: Reset pr4m_test + fixtures for the API tests
      id: reset
      if: ${{ !cancelled() }}
      continue-on-error: true
      env:
        PGHOST: 127.0.0.1
        PGPASSWORD: nouman
      run: bash tools/api-tester/harness/prepare-test-db.sh

    - name: Start Apache with the diagnostics log
      id: apache
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |
        cp docker/php/conf.d/diagnostics.ini "$PHP_INI_DIR/conf.d/zz-diagnostics.ini"
        rm -rf /var/www/html
        ln -s "$GITHUB_WORKSPACE" /var/www/html
        chown -R www-data:www-data "$GITHUB_WORKSPACE"
        # setsid: Apache must outlive this docker exec session.
        setsid apache2-foreground > /tmp/apache.log 2>&1 < /dev/null &
        for i in $(seq 1 30); do
          curl -s -o /dev/null "http://127.0.0.1/" && echo "Apache is up" && exit 0
          sleep 1
        done
        echo "Apache did not come up in time" >&2
        cat /tmp/apache.log >&2
        exit 1

    - name: Run backend API testing
      id: api-tester
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |
        tools/api-tester/harness/run-api-tests.sh \
          --base-uri http://127.0.0.1 \
          --mode backend,acl \
          --record-bodies

    - name: Collect the Apache log
      if: ${{ !cancelled() }}
      run: cp /tmp/apache.log upgrade/apache.log || true

    # The summary lists these, so a failed step shows there even though the job stays green.
    - name: Record the step outcomes
      if: ${{ !cancelled() }}
      run: |
        {
          echo "dry-run ${{ steps.dry-run.outcome }}"
          echo "migrate ${{ steps.migrate.outcome }}"
          echo "schema-snapshot ${{ steps.schema.outcome }}"
          echo "prepare-test-db ${{ steps.prepare.outcome }}"
          echo "phpunit ${{ steps.phpunit.outcome }}"
          echo "lint ${{ steps.lint.outcome }}"
          echo "reset-test-db ${{ steps.reset.outcome }}"
          echo "apache ${{ steps.apache.outcome }}"
          echo "api-tester ${{ steps.api-tester.outcome }}"
        } > upgrade/steps.txt
        cat upgrade/steps.txt

    - name: Upload the next-stack outputs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: upgrade-next
        path: |
          upgrade/
          output/api-tester-backend-report.json
          output/api-tester-acl-report.json
          logs/php-diagnostics.log
          logs/php-diagnostics-phpunit.log
        if-no-files-found: warn

  # Compares the two stacks and writes the job summary. Runs on the current image: the report
  # scripts only need PHP, and the comparison must not depend on what fails on the next stack.
  upgrade-report:
    name: Next-stack report
    needs: [api-testing, next-stack]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    container:
      image: rananoman/gaia:env-dev

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Download the current-stack outputs
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: upgrade-current
        path: upgrade/current

    - name: Download the next-stack outputs
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: upgrade-next
        path: upgrade/next

    - name: Compare the stacks and write the summary
      run: bash tools/upgrade/compare-stacks.sh upgrade | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload the comparison
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upgrade-report
        path: |
          upgrade/schema.diff
          upgrade/compare-*.txt
          upgrade/deprecations.md
        if-no-files-found: warn
